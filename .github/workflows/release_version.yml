name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic package version, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  SOLUTION_FILE: Bank3.slnx
  PACKAGE_PROJECT: Bank.WebApi/Bank.WebApi.csproj
  TEST_PROJECT: Bank.WebApi.Test/Bank.WebApi.Test.csproj
  PACKAGE_OUTPUT: artifacts/packages
  VERSION_PREFIX: v
  PACKAGE_VERSION_INPUT: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package_version="${PACKAGE_VERSION_INPUT}"
          else
            package_version="${GITHUB_REF_NAME#"${VERSION_PREFIX}"}"
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $package_version" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${VERSION_PREFIX}${package_version}" >> "$GITHUB_ENV"

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Run unit tests
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Build package
        run: |
          dotnet pack "${{ env.PACKAGE_PROJECT }}" \
            --configuration Release \
            --no-restore \
            --output "${{ env.PACKAGE_OUTPUT }}" \
            /p:PackageVersion="${PACKAGE_VERSION}" \
            /p:Version="${PACKAGE_VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${PACKAGE_OUTPUT}"/*.nupkg \
            --title "${RELEASE_TAG}" \
            --generate-notes
