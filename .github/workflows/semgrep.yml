name: Semgrep Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  SEMGREP_CONFIG: p/default
  SEMGREP_OUTPUT: semgrep.json
  HTML_REPORT: semgrep-report.html
  PAGES_DIR: site

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install analysis tools
        run: python -m pip install --disable-pip-version-check semgrep prospector2html

      - name: Run Semgrep
        run: |
          set +e
          semgrep scan --config="${{ env.SEMGREP_CONFIG }}" --json --output="${{ env.SEMGREP_OUTPUT }}" --metrics=off
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Generate HTML report
        run: prospector-html --input="${{ env.SEMGREP_OUTPUT }}" --output="${{ env.HTML_REPORT }}" --filter semgrep --zero-exit

      - name: Prepare Pages artifact
        run: |
          mkdir -p "${{ env.PAGES_DIR }}"
          cp "${{ env.HTML_REPORT }}" "${{ env.PAGES_DIR }}/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e