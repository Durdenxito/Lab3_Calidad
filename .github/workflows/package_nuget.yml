name: Test and Publish NuGet Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.x'
  SOLUTION_FILE: Bank3.slnx
  PACKAGE_PROJECT: Bank.WebApi/Bank.WebApi.csproj
  TEST_PROJECT: Bank.WebApi.Test/Bank.WebApi.Test.csproj
  COVERAGE_SETTINGS: coverage.runsettings
  PACKAGE_OUTPUT: artifacts/packages
  PACKAGE_VERSION: 1.0.${{ github.run_number }}
  PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore --no-incremental

      - name: Run unit tests with coverage
        run: |
          dotnet test "${{ env.SOLUTION_FILE }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings "${{ env.COVERAGE_SETTINGS }}"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-and-coverage-reports
          path: |
            **/test-results.trx
            **/coverage.opencover.xml
          if-no-files-found: error

      - name: Pack Bank.WebApi
        if: success()
        run: |
          dotnet pack "${{ env.PACKAGE_PROJECT }}" \
            --configuration Release \
            --no-restore \
            --output "${{ env.PACKAGE_OUTPUT }}" \
            -p:PackageVersion="${{ env.PACKAGE_VERSION }}"

      - name: Upload NuGet package artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bank-web-api-package
          path: "${{ env.PACKAGE_OUTPUT }}/*.nupkg"
          if-no-files-found: error

      - name: Publish package to GitHub Packages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "${PACKAGE_OUTPUT}"/*.nupkg \
            --source "${PACKAGE_SOURCE}" \
            --api-key "${PACKAGE_TOKEN}" \
            --skip-duplicate
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
